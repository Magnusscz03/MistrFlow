name: Verify complete release

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify tracked files contain no privileged secrets
        run: python3 scripts/verify_no_secrets.py

      - name: Test secret scanner
        run: python3 scripts/test_verify_no_secrets.py

      - name: Verify deployment manifest
        run: node scripts/verify-deploy.mjs

      - name: Verify complete release
        run: python3 scripts/verify_release.py

      - name: Verify public-only PWA cache
        run: python3 scripts/verify_pwa_cache.py

      - name: Verify Supabase-only runtime
        run: python3 scripts/verify_supabase_target.py

      - name: Test production verifier
        run: python3 scripts/test_verify_production.py

      - name: Test security-header verifier
        run: python3 scripts/test_verify_security_headers.py

      - name: Verify published Android APK
        run: python3 scripts/verify_published_apk.py
